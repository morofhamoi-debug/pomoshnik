<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#050507">
    <title>Dynamic Bounce</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050507;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
            color: #FFFFFF;
            touch-action: none;
            position: fixed;
            top: 0;
            left: 0;
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at center, #0d0e15 0%, #050507 100%);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        .screen-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: calc(env(safe-area-inset-top, 20px) + 20px) 24px calc(env(safe-area-inset-bottom, 20px) + 24px);
            z-index: 10;
            transition: opacity 0.4s ease, visibility 0.4s ease;
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }

        .screen-overlay.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        /* Top Bar Info */
        .hud-header {
            position: absolute;
            top: calc(env(safe-area-inset-top, 12px) + 12px);
            left: 0;
            width: 100%;
            padding: 0 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 5;
            pointer-events: none;
        }

        .score-pill {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 20px;
            padding: 6px 16px;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.5px;
            color: rgba(255, 255, 255, 0.9);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .audio-btn {
            pointer-events: auto;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 50%;
            width: 36px;
            height: 36px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: transform 0.2s cubic-bezier(0.2, 0.8, 0.2, 1), background-color 0.2s ease;
        }

        .audio-btn:active {
            transform: scale(0.9);
            background: rgba(255, 255, 255, 0.18);
        }

        .audio-btn svg {
            width: 18px;
            height: 18px;
            fill: #FFFFFF;
        }

        /* Hero / Logo Section */
        .brand-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 40px;
            text-align: center;
        }

        .logo-icon {
            width: 48px;
            height: 20px;
            background: #FFFFFF;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.5);
            position: relative;
        }

        .logo-icon::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 8px;
            height: 8px;
            background: #050507;
            border-radius: 50%;
        }

        .app-title {
            font-size: 32px;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: linear-gradient(180deg, #FFFFFF 0%, rgba(255, 255, 255, 0.6) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        .app-subtitle {
            font-size: 14px;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.5);
            max-width: 240px;
            line-height: 1.4;
        }

        /* Buttons Styling */
        .action-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            margin-bottom: calc(env(safe-area-inset-bottom, 0px));
        }

        .btn-oval {
            width: 100%;
            max-width: 320px;
            height: 56px;
            border-radius: 28px;
            background: #FFFFFF;
            color: #000000;
            font-size: 17px;
            font-weight: 600;
            border: none;
            outline: none;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 8px 30px rgba(255, 255, 255, 0.15);
            transition: transform 0.2s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.2s ease, background-color 0.2s ease;
        }

        .btn-oval:active {
            transform: scale(0.96);
            opacity: 0.88;
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: #FFFFFF;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: none;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .btn-secondary:active {
            background: rgba(255, 255, 255, 0.2);
        }

        /* Game Over Stats */
        .stats-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 24px;
            width: 100%;
            max-width: 320px;
            text-align: center;
            margin: auto 0;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        }

        .stats-label {
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: rgba(255, 255, 255, 0.4);
            margin-bottom: 4px;
        }

        .stats-value-large {
            font-size: 56px;
            font-weight: 800;
            letter-spacing: -1px;
            color: #FFFFFF;
            margin-bottom: 16px;
            line-height: 1;
        }

        .stats-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }

        .stats-row-label {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.6);
        }

        .stats-row-value {
            font-size: 16px;
            font-weight: 600;
            color: #FFFFFF;
        }

        @media (prefers-reduced-motion: reduce) {
            .screen-overlay, .btn-oval, .audio-btn {
                transition: none !important;
            }
        }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- Canvas Element -->
        <canvas id="gameCanvas"></canvas>

        <!-- Dynamic Game Header HUD -->
        <div class="hud-header">
            <div id="hudScore" class="score-pill">0</div>
            <button id="audioToggle" class="audio-btn" aria-label="Звук">
                <svg id="iconSoundOn" viewBox="0 0 24 24">
                    <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
                </svg>
                <svg id="iconSoundOff" viewBox="0 0 24 24" style="display: none;">
                    <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
                </svg>
            </button>
        </div>

        <!-- Start Screen -->
        <div id="startScreen" class="screen-overlay">
            <div class="brand-section">
                <div class="logo-icon"></div>
                <h1 class="app-title">DYNAMIC BOUNCE</h1>
                <p class="app-subtitle">Минималистичная аркада. Управляйте платформой и отбивайте мяч.</p>
            </div>
            <div class="action-container">
                <button id="startBtn" class="btn-oval">Начать</button>
            </div>
        </div>

        <!-- Game Over Screen -->
        <div id="gameOverScreen" class="screen-overlay hidden">
            <div class="brand-section" style="margin-top: 20px;">
                <h1 class="app-title" style="font-size: 24px;">РАУНД ЗАВЕРШЕН</h1>
            </div>

            <div class="stats-card">
                <div class="stats-label">Итоговый счет</div>
                <div id="finalScore" class="stats-value-large">0</div>
                <div class="stats-row">
                    <span class="stats-row-label">Рекорд</span>
                    <span id="bestScore" class="stats-row-value">0</span>
                </div>
            </div>

            <div class="action-container">
                <button id="restartBtn" class="btn-oval">Еще раз</button>
                <button id="homeBtn" class="btn-oval btn-secondary">В меню</button>
            </div>
        </div>
    </div>

    <script>
        /**
         * AUDIO SYNTHESIZER (Web Audio API)
         * Generates pleasant, latency-free, low-footprint sound synthesis without external MP3 assets.
         */
        class SoundEngine {
            constructor() {
                this.ctx = null;
                this.muted = false;
                this.initialized = false;
            }

            init() {
                if (this.initialized) return;
                try {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    if (AudioContext) {
                        this.ctx = new AudioContext();
                        this.initialized = true;
                    }
                } catch (e) {
                    console.warn('Web Audio API not supported:', e);
                }
            }

            resume() {
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            playBounce(isPaddle = true) {
                if (this.muted || !this.ctx) return;
                this.resume();

                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();

                    osc.type = isPaddle ? 'sine' : 'triangle';
                    
                    // Higher pitch for paddle hit, lower soft thud for wall
                    const startFreq = isPaddle ? 440 : 220;
                    const endFreq = isPaddle ? 880 : 110;

                    osc.frequency.setValueAtTime(startFreq, this.ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(endFreq, this.ctx.currentTime + 0.08);

                    gain.gain.setValueAtTime(isPaddle ? 0.3 : 0.15, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.08);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);

                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.08);
                } catch (e) {
                    // Ignore audio playback exceptions safely
                }
            }

            playGameOver() {
                if (this.muted || !this.ctx) return;
                this.resume();

                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();

                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(200, this.ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(60, this.ctx.currentTime + 0.35);

                    gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.35);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);

                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.35);
                } catch (e) {
                    // Ignore audio errors
                }
            }
        }

        /**
         * HAPTIC FEEDBACK SYSTEM
         * NOTE ON iOS SAFARI HAPTIC LIMITATIONS:
         * Standard Apple Mobile Safari strictly restricts tactile/haptic vibrations via JavaScript inside ordinary web pages.
         * The standard `navigator.vibrate()` API is disabled on iOS Safari.
         * Advanced Haptics (UIFeedbackGenerator) are ONLY exposed inside WebViews (WkWebView) or PWAs installed to Home Screen on specific iOS versions.
         * To ensure robust, failure-proof execution without throwing errors:
         * 1. We test for standard `navigator.vibrate`.
         * 2. We provide fallback visual feedback (paddle glow flash and micro particle pulse) on every hit.
         * 3. We trigger synchronized audio synth sound FX to provide rich sensory feedback.
         */
        class HapticEngine {
            triggerHit() {
                if ('vibrate' in navigator && typeof navigator.vibrate === 'function') {
                    try {
                        navigator.vibrate(12);
                    } catch (e) {
                        // Silent catch if browser restricts vibration invocation
                    }
                }
            }
        }

        /**
         * PARTICLE visual effects system for hit dynamic illumination
         */
        class ParticleSystem {
            constructor() {
                this.particles = [];
            }

            spawnHitBurst(x, y, color) {
                const count = 12;
                for (let i = 0; i < count; i++) {
                    const angle = (Math.PI * 2 * i) / count + (Math.random() * 0.5 - 0.25);
                    const speed = 2 + Math.random() * 4;
                    this.particles.push({
                        x: x,
                        y: y,
                        vx: Math.cos(angle) * speed,
                        vy: Math.sin(angle) * speed,
                        radius: 1.5 + Math.random() * 2.5,
                        alpha: 1,
                        decay: 0.03 + Math.random() * 0.03,
                        color: color || '#FFFFFF'
                    });
                }
            }

            update(dt) {
                for (let i = this.particles.length - 1; i >= 0; i--) {
                    const p = this.particles[i];
                    p.x += p.vx * dt * 60;
                    p.y += p.vy * dt * 60;
                    p.alpha -= p.decay * dt * 60;

                    if (p.alpha <= 0) {
                        this.particles.splice(i, 1);
                    }
                }
            }

            draw(ctx) {
                ctx.save();
                for (let i = 0; i < this.particles.length; i++) {
                    const p = this.particles[i];
                    ctx.globalAlpha = Math.max(0, p.alpha);
                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore();
            }

            clear() {
                this.particles = [];
            }
        }

        /**
         * MAIN GAME ENGINE
         */
        class GameEngine {
            constructor() {
                this.canvas = document.getElementById('gameCanvas');
                this.ctx = this.canvas.getContext('2d');

                // Audio & Haptics
                this.audio = new SoundEngine();
                this.haptics = new HapticEngine();
                this.particles = new ParticleSystem();

                // UI Elements
                this.startScreen = document.getElementById('startScreen');
                this.gameOverScreen = document.getElementById('gameOverScreen');
                this.hudScore = document.getElementById('hudScore');
                this.finalScoreEl = document.getElementById('finalScore');
                this.bestScoreEl = document.getElementById('bestScore');
                this.startBtn = document.getElementById('startBtn');
                this.restartBtn = document.getElementById('restartBtn');
                this.homeBtn = document.getElementById('homeBtn');
                this.audioToggleBtn = document.getElementById('audioToggle');
                this.iconSoundOn = document.getElementById('iconSoundOn');
                this.iconSoundOff = document.getElementById('iconSoundOff');

                // Screen & Scale Settings
                this.width = 0;
                this.height = 0;
                this.dpr = 1;

                // Game State variables
                this.state = 'START'; // 'START', 'PLAYING', 'GAMEOVER'
                this.score = 0;
                this.highScore = this.loadHighScore();
                this.lastTime = 0;
                this.animFrameId = null;

                // Game Objects
                this.ball = {
                    x: 0,
                    y: 0,
                    vx: 0,
                    vy: 0,
                    radius: 8,
                    baseSpeed: 400, // Logical pixels per second
                    speed: 400,
                    maxSpeed: 850,
                    lastHitTime: 0
                };

                this.paddle = {
                    x: 0,
                    y: 0,
                    width: 110,
                    height: 28,
                    radius: 14, // Pill rounded capsule shape
                    targetX: 0,
                    flashIntensity: 0
                };

                this.input = {
                    isPointerDown: false,
                    pointerX: 0
                };

                this.init();
            }

            loadHighScore() {
                try {
                    const saved = localStorage.getItem('dynamic_bounce_highscore');
                    return saved ? parseInt(saved, 10) || 0 : 0;
                } catch (e) {
                    return 0; // Fallback if localStorage disabled / restricted
                }
            }

            saveHighScore(score) {
                try {
                    localStorage.setItem('dynamic_bounce_highscore', score.toString());
                } catch (e) {
                    // Ignore storage save failures
                }
            }

            init() {
                this.resizeCanvas();
                window.addEventListener('resize', () => this.resizeCanvas());
                window.addEventListener('orientationchange', () => setTimeout(() => this.resizeCanvas(), 100));

                this.setupInputs();
                this.setupUI();
                this.resetBallAndPaddle();

                // Start initial background render loop
                this.lastTime = performance.now();
                this.animFrameId = requestAnimationFrame((t) => this.loop(t));
            }

            resizeCanvas() {
                this.dpr = window.devicePixelRatio || 1;
                this.width = window.innerWidth;
                this.height = window.innerHeight;

                this.canvas.width = this.width * this.dpr;
                this.canvas.height = this.height * this.dpr;
                this.ctx.scale(this.dpr, this.dpr);

                // Adjust relative paddle y position (safe distance above Home Indicator)
                const safeBottomPadding = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--safe-area-inset-bottom') || '20', 10);
                this.paddle.y = this.height - Math.max(60, safeBottomPadding + 45);

                // Re-clamp paddle position inside canvas bounds
                this.clampPaddlePosition();
            }

            clampPaddlePosition() {
                const halfWidth = this.paddle.width / 2;
                if (this.paddle.x < halfWidth) this.paddle.x = halfWidth;
                if (this.paddle.x > this.width - halfWidth) this.paddle.x = this.width - halfWidth;
            }

            setupInputs() {
                // Pointer Event listeners handling both Touch and Mouse seamlessly
                const onPointerMove = (e) => {
                    if (this.state === 'PLAYING') {
                        this.paddle.targetX = e.clientX;
                    }
                };

                const onPointerDown = (e) => {
                    this.audio.init();
                    if (this.state === 'PLAYING') {
                        this.input.isPointerDown = true;
                        this.paddle.targetX = e.clientX;
                    }
                };

                const onPointerUp = () => {
                    this.input.isPointerDown = false;
                };

                window.addEventListener('pointerdown', onPointerDown);
                window.addEventListener('pointermove', onPointerMove);
                window.addEventListener('pointerup', onPointerUp);
                window.addEventListener('pointercancel', onPointerUp);

                // Visibility change detection to prevent teleporting ball
                document.addEventListener('visibilitychange', () => {
                    if (document.hidden && this.state === 'PLAYING') {
                        this.lastTime = performance.now();
                    }
                });
            }

            setupUI() {
                this.startBtn.addEventListener('click', () => {
                    this.audio.init();
                    this.startGame();
                });

                this.restartBtn.addEventListener('click', () => {
                    this.audio.init();
                    this.startGame();
                });

                this.homeBtn.addEventListener('click', () => {
                    this.showStartScreen();
                });

                this.audioToggleBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    this.audio.init();
                    this.audio.muted = !this.audio.muted;
                    if (this.audio.muted) {
                        this.iconSoundOn.style.display = 'none';
                        this.iconSoundOff.style.display = 'block';
                    } else {
                        this.iconSoundOn.style.display = 'block';
                        this.iconSoundOff.style.display = 'none';
                    }
                });
            }

            showStartScreen() {
                this.state = 'START';
                this.gameOverScreen.classList.add('hidden');
                this.startScreen.classList.remove('hidden');
                this.resetBallAndPaddle();
            }

            startGame() {
                this.state = 'PLAYING';
                this.score = 0;
                this.hudScore.textContent = '0';
                this.startScreen.classList.add('hidden');
                this.gameOverScreen.classList.add('hidden');
                this.particles.clear();

                this.resetBallAndPaddle();
                this.launchBall();
            }

            gameOver() {
                this.state = 'GAMEOVER';
                this.audio.playGameOver();

                if (this.score > this.highScore) {
                    this.highScore = this.score;
                    this.saveHighScore(this.highScore);
                }

                this.finalScoreEl.textContent = this.score.toString();
                this.bestScoreEl.textContent = this.highScore.toString();

                this.gameOverScreen.classList.remove('hidden');
            }

            resetBallAndPaddle() {
                this.paddle.x = this.width / 2;
                this.paddle.targetX = this.width / 2;
                this.paddle.flashIntensity = 0;

                this.ball.x = this.width / 2;
                this.ball.y = this.paddle.y - 120;
                this.ball.vx = 0;
                this.ball.vy = 0;
                this.ball.speed = this.ball.baseSpeed;
            }

            launchBall() {
                // Launch ball upwards with controlled random angle (-30deg to +30deg)
                const angle = (Math.random() * 60 - 30) * (Math.PI / 180);
                this.ball.speed = this.ball.baseSpeed;
                this.ball.vx = this.ball.speed * Math.sin(angle);
                this.ball.vy = -this.ball.speed * Math.cos(angle);
            }

            /**
             * Advanced physics update with delta-time safety step-subdivisions.
             * Prevents ball tunneling through paddle or walls at high velocities.
             */
            updatePhysics(dt) {
                if (this.state !== 'PLAYING') return;

                // Smoothly lerp paddle position towards finger/mouse target
                const lerpFactor = 0.25;
                this.paddle.x += (this.paddle.targetX - this.paddle.x) * lerpFactor;
                this.clampPaddlePosition();

                // Dim hit highlight animation
                if (this.paddle.flashIntensity > 0) {
                    this.paddle.flashIntensity -= dt * 4;
                    if (this.paddle.flashIntensity < 0) this.paddle.flashIntensity = 0;
                }

                // Substep collision system to prevent frame-skipping / tunneling
                const totalMove = Math.hypot(this.ball.vx * dt, this.ball.vy * dt);
                const maxStep = 4; // Maximum travel distance per sub-step in logical pixels
                const steps = Math.max(1, Math.ceil(totalMove / maxStep));
                const subDt = dt / steps;

                for (let s = 0; s < steps; s++) {
                    this.ball.x += this.ball.vx * subDt;
                    this.ball.y += this.ball.vy * subDt;

                    // Wall Collision: Left / Right
                    if (this.ball.x - this.ball.radius <= 0) {
                        this.ball.x = this.ball.radius;
                        this.ball.vx = Math.abs(this.ball.vx);
                        this.audio.playBounce(false);
                    } else if (this.ball.x + this.ball.radius >= this.width) {
                        this.ball.x = this.width - this.ball.radius;
                        this.ball.vx = -Math.abs(this.ball.vx);
                        this.audio.playBounce(false);
                    }

                    // Wall Collision: Top
                    if (this.ball.y - this.ball.radius <= 0) {
                        this.ball.y = this.ball.radius;
                        this.ball.vy = Math.abs(this.ball.vy);
                        this.audio.playBounce(false);
                    }

                    // Bottom Boundary: Game Over trigger
                    if (this.ball.y - this.ball.radius > this.height) {
                        this.gameOver();
                        return;
                    }

                    // Paddle Capsule Geometric Intersection Test
                    this.checkPaddleCollision();
                }

                // Particle Engine updates
                this.particles.update(dt);
            }

            /**
             * Capsule geometric intersection test for smooth oval deflection
             */
            checkPaddleCollision() {
                // Debounce double hit registration in consecutive sub-steps
                const now = performance.now();
                if (now - this.ball.lastHitTime < 100) return;

                // Only detect collision if ball is moving downwards
                if (this.ball.vy <= 0) return;

                const py = this.paddle.y;
                const px = this.paddle.x;
                const pw = this.paddle.width;
                const ph = this.paddle.height;
                const halfW = pw / 2 - ph / 2; // Flat inner segment length from center

                // Nearest point on paddle's internal center line segment
                let nearestX = Math.max(px - halfW, Math.min(px + halfW, this.ball.x));
                let nearestY = py;

                const distX = this.ball.x - nearestX;
                const distY = this.ball.y - nearestY;
                const distance = Math.hypot(distX, distY);
                const minDistance = this.ball.radius + (ph / 2);

                if (distance <= minDistance) {
                    this.ball.lastHitTime = now;

                    // Calculate deflection angle based on impact distance from center
                    const relativeImpact = (this.ball.x - px) / (pw / 2); // -1.0 (left edge) to +1.0 (right edge)
                    const clampedImpact = Math.max(-1, Math.min(1, relativeImpact));

                    // Max deflection angle: 60 degrees from vertical
                    const maxAngle = (60 * Math.PI) / 180;
                    const bounceAngle = clampedImpact * maxAngle;

                    // Progressive speed increase (2.5% increase per bounce up to max limit)
                    this.ball.speed = Math.min(this.ball.maxSpeed, this.ball.speed * 1.025);

                    // Recalculate velocity vectors
                    this.ball.vx = this.ball.speed * Math.sin(bounceAngle);
                    this.ball.vy = -this.ball.speed * Math.cos(bounceAngle);

                    // Separate ball outside collision zone
                    const overlap = minDistance - distance;
                    if (distance > 0) {
                        this.ball.x += (distX / distance) * (overlap + 1);
                        this.ball.y += (distY / distance) * (overlap + 1);
                    } else {
                        this.ball.y = py - (ph / 2) - this.ball.radius - 1;
                    }

                    // Score increment & visual effects
                    this.score += 1;
                    this.hudScore.textContent = this.score.toString();
                    this.paddle.flashIntensity = 1.0;

                    // Trigger Audio, Haptics & Particle burst
                    this.audio.playBounce(true);
                    this.haptics.triggerHit();
                    this.particles.spawnHitBurst(this.ball.x, this.ball.y + this.ball.radius, '#FFFFFF');
                }
            }

            render() {
                this.ctx.clearRect(0, 0, this.width, this.height);

                // Render Particles
                this.particles.draw(this.ctx);

                // Render Paddle (Dynamic Island Capsule Style)
                this.drawPaddle();

                // Render Ball
                if (this.state === 'PLAYING') {
                    this.drawBall();
                }
            }

            drawPaddle() {
                const p = this.paddle;
                const x = p.x - p.width / 2;
                const y = p.y - p.height / 2;
                const radius = p.height / 2;

                this.ctx.save();

                // Outer ambient glow
                this.ctx.shadowColor = 'rgba(255, 255, 255, ' + (0.15 + p.flashIntensity * 0.5) + ')';
                this.ctx.shadowBlur = 15 + p.flashIntensity * 20;

                // Base Dynamic Island Capsule body
                this.ctx.fillStyle = p.flashIntensity > 0 ? '#FFFFFF' : '#0F1015';
                this.ctx.beginPath();
                this.ctx.roundRect(x, y, p.width, p.height, radius);
                this.ctx.fill();

                // Inner contrast border
                this.ctx.lineWidth = 1.5;
                this.ctx.strokeStyle = `rgba(255, 255, 255, ${0.2 + p.flashIntensity * 0.6})`;
                this.ctx.stroke();

                // Subtle top glass specularity reflection
                const reflectGrad = this.ctx.createLinearGradient(x, y, x, y + p.height / 2);
                reflectGrad.addColorStop(0, 'rgba(255, 255, 255, 0.25)');
                reflectGrad.addColorStop(1, 'rgba(255, 255, 255, 0.0)');

                this.ctx.fillStyle = reflectGrad;
                this.ctx.beginPath();
                this.ctx.roundRect(x + 2, y + 1, p.width - 4, p.height / 2, [radius, radius, 0, 0]);
                this.ctx.fill();

                this.ctx.restore();
            }

            drawBall() {
                const b = this.ball;

                this.ctx.save();

                // Ball Outer Glow
                this.ctx.shadowColor = 'rgba(255, 255, 255, 0.6)';
                this.ctx.shadowBlur = 12;

                // 3D Volume Gradient
                const grad = this.ctx.createRadialGradient(
                    b.x - b.radius * 0.3,
                    b.y - b.radius * 0.3,
                    b.radius * 0.1,
                    b.x,
                    b.y,
                    b.radius
                );
                grad.addColorStop(0, '#FFFFFF');
                grad.addColorStop(0.8, '#E0E0E5');
                grad.addColorStop(1, '#9999A0');

                this.ctx.fillStyle = grad;
                this.ctx.beginPath();
                this.ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
                this.ctx.fill();

                this.ctx.restore();
            }

            loop(timestamp) {
                let dt = (timestamp - this.lastTime) / 1000;
                this.lastTime = timestamp;

                // Clamp delta time to max 0.033s (30fps equivalent) to prevent massive physical skips on tab return
                if (dt > 0.033) dt = 0.033;

                this.updatePhysics(dt);
                this.render();

                this.animFrameId = requestAnimationFrame((t) => this.loop(t));
            }
        }

        // Initialize Game once DOM content is ready
        window.addEventListener('DOMContentLoaded', () => {
            window.gameInstance = new GameEngine();
        });
    </script>
</body>
</html>
