<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Поляна от первого лица</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: sans-serif;
        }
        #instructions {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.75);
            z-index: 10;
        }
        #start-btn {
            background: linear-gradient(to bottom, #d47a15, #8a3b00);
            border: 3px solid #ffd700;
            border-radius: 12px;
            color: #ffffff;
            font-size: 24px;
            font-weight: bold;
            padding: 15px 50px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
            transition: transform 0.1s;
        }
        #start-btn:hover {
            transform: scale(1.05);
        }
        .controls-hint {
            color: white;
            margin-top: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            font-size: 18px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="instructions">
        <button id="start-btn">▶ НАЧАТЬ ИГРУ</button>
        <div class="controls-hint">Управление: W, A, S, D — ходить, Мышь — оглядываться.</div>
    </div>

    <!-- Подключаем Three.js и PointerLockControls для управления от 1-го лица -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>

    <script>
        let scene, camera, renderer, controls;
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
        let prevTime = performance.now();
        let velocity = new THREE.Vector3();
        let direction = new THREE.Vector3();
        let handsGroup, legsGroup;
        let handAnimTime = 0;
        let grassMesh;
        let clock = new THREE.Clock();

        init();
        animate();

        function init() {
            // Сцена
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87ceeb);
            scene.fog = new THREE.FogExp2(0x87ceeb, 0.012);

            // Камера (от первого лица)
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.y = 1.7; // Рост человека

            // Рендерер
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.body.appendChild(renderer.domElement);

            // Управление мышкой (как в играх)
            controls = new THREE.PointerLockControls(camera, document.body);
            
            const instructions = document.getElementById('instructions');
            const startBtn = document.getElementById('start-btn');

            startBtn.addEventListener('click', () => {
                controls.lock();
            });

            controls.addEventListener('lock', () => {
                instructions.style.display = 'none';
            });

            controls.addEventListener('unlock', () => {
                instructions.style.display = 'flex';
            });

            scene.add(controls.object);

            // Обработка клавиатуры
            const onKeyDown = function (event) {
                switch (event.code) {
                    case 'KeyW': case 'ArrowUp': moveForward = true; break;
                    case 'KeyS': case 'ArrowDown': moveBackward = true; break;
                    case 'KeyA': case 'ArrowLeft': moveLeft = true; break;
                    case 'KeyD': case 'ArrowRight': moveRight = true; break;
                }
            };

            const onKeyUp = function (event) {
                switch (event.code) {
                    case 'KeyW': case 'ArrowUp': moveForward = false; break;
                    case 'KeyS': case 'ArrowDown': moveBackward = false; break;
                    case 'KeyA': case 'ArrowLeft': moveLeft = false; break;
                    case 'KeyD': case 'ArrowRight': moveRight = false; break;
                }
            };

            document.addEventListener('keydown', onKeyDown);
            document.addEventListener('keyup', onKeyUp);

            // Свет
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const sunLight = new THREE.DirectionalLight(0xfffaed, 0.9);
            sunLight.position.set(100, 300, 100);
            sunLight.castShadow = true;
            scene.add(sunLight);

            // 1. НЕБО (Купол с вашей второй картинкой sky.jpg — солнце и облака)
            const skyGeo = new THREE.SphereGeometry(500, 32, 32);
            const textureLoader = new THREE.TextureLoader();
            
            const skyMat = new THREE.MeshBasicMaterial({
                map: textureLoader.load('sky.jpg'),
                side: THREE.BackSide
            });
            const sky = new THREE.Mesh(skyGeo, skyMat);
            scene.add(sky);

            // 2. ЗЕМЛЯ И ТРАВА (с вашей первой картинкой grass.jpg)
            const floorGeo = new THREE.PlaneGeometry(300, 300);
            const grassTexture = textureLoader.load('grass.jpg');
            grassTexture.wrapS = THREE.RepeatWrapping;
            grassTexture.wrapT = THREE.RepeatWrapping;
            grassTexture.repeat.set(150, 150);

            const floorMat = new THREE.MeshStandardMaterial({
                map: grassTexture,
                roughness: 0.8
            });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            scene.add(floor);

            // 3. РУКИ ЧЕЛОВЕКА (с рукавами из image_7.png)
            handsGroup = new THREE.Group();
            
            const skinMat = new THREE.MeshLambertMaterial({ color: 0xd8a47f }); // Цвет кожи рук
            const sleeveMat = new THREE.MeshLambertMaterial({ color: 0x111111 }); // Черный рукав с узором
            const accentMat = new THREE.MeshLambertMaterial({ color: 0xd35400 }); // Оранжевая окантовка

            // Левая рука (рукав + кисть)
            const leftArmGroup = new THREE.Group();
            const leftSleeve = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.08, 0.5, 16), sleeveMat);
            leftSleeve.rotation.z = -Math.PI / 4;
            const leftBand = new THREE.Mesh(new THREE.CylinderGeometry(0.061, 0.061, 0.05, 16), accentMat);
            leftBand.position.set(0, -0.2, 0);
            leftBand.rotation.z = -Math.PI / 4;
            const leftHand = new THREE.Mesh(new THREE.BoxGeometry(0.07, 0.09, 0.1), skinMat);
            leftHand.position.set(-0.2, -0.3, 0);
            leftArmGroup.add(leftSleeve, leftBand, leftHand);
            leftArmGroup.position.set(-0.3, -0.35, -0.5);
            handsGroup.add(leftArmGroup);

            // Правая рука (рукав + кисть)
            const rightArmGroup = new THREE.Group();
            const rightSleeve = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.08, 0.5, 16), sleeveMat);
            rightSleeve.rotation.z = Math.PI / 4;
            const rightBand = new THREE.Mesh(new THREE.CylinderGeometry(0.061, 0.061, 0.05, 16), accentMat);
            rightBand.position.set(0, -0.2, 0);
            rightBand.rotation.z = Math.PI / 4;
            const rightHand = new THREE.Mesh(new THREE.BoxGeometry(0.07, 0.09, 0.1), skinMat);
            rightHand.position.set(0.2, -0.3, 0);
            rightArmGroup.add(rightSleeve, rightBand, rightHand);
            rightArmGroup.position.set(0.3, -0.35, -0.5);
            handsGroup.add(rightArmGroup);

            camera.add(handsGroup);

            // 4. НОГИ ЧЕЛОВЕКА (реалистичные босые ноги с пальцами, как на image_8.png)
            legsGroup = new THREE.Group();
            
            function createFoot() {
                const footGroup = new THREE.Group();
                const shin = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.08, 0.5, 16), skinMat);
                shin.position.set(0, -0.2, 0);
                
                const footBase = new THREE.Mesh(new THREE.BoxGeometry(0.09, 0.06, 0.22), skinMat);
                footBase.position.set(0, -0.48, 0.05);

                // Пальцы ног
                for(let i=0; i<5; i++) {
                    const toe = new THREE.Mesh(new THREE.SphereGeometry(0.015, 8, 8), skinMat);
                    toe.scale.set(0.8, 0.6, 1.5);
                    toe.position.set(-0.03 + i * 0.015, -0.48, 0.16);
                    footGroup.add(toe);
                }

                footGroup.add(shin, footBase);
                return footGroup;
            }

            const leftFoot = createFoot();
            leftFoot.position.set(-0.16, -1.0, -0.4);
            leftFoot.rotation.x = 0.15;

            const rightFoot = createFoot();
            rightFoot.position.set(0.16, -1.0, -0.4);
            rightFoot.rotation.x = -0.15;

            legsGroup.add(leftFoot, rightFoot);
            camera.add(legsGroup);

            // Изменение размера окна
            window.addEventListener('resize', onWindowResize);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            const time = performance.now();
            const delta = (time - prevTime) / 1000;
            const elapsedTime = clock.getElapsedTime();

            if (controls.isLocked === true) {
                velocity.x -= velocity.x * 10.0 * delta;
                velocity.z -= velocity.z * 10.0 * delta;

                direction.z = Number(moveForward) - Number(moveBackward);
                direction.x = Number(moveRight) - Number(moveLeft);
                direction.normalize();

                if (moveForward || moveBackward) velocity.z -= direction.z * 40.0 * delta;
                if (moveLeft || moveRight) velocity.x -= direction.x * 40.0 * delta;

                controls.moveRight(-velocity.x * delta);
                controls.moveForward(-velocity.z * delta);

                // Анимация покачивания рук и ног при ходьбе
                if (moveForward || moveBackward || moveLeft || moveRight) {
                    handAnimTime += delta * 12;
                    handsGroup.position.y = Math.sin(handAnimTime) * 0.03;
                    handsGroup.position.x = Math.cos(handAnimTime * 0.5) * 0.02;

                    // Шагающие движения ног
                    legsGroup.position.y = Math.sin(handAnimTime) * 0.05;
                    legsGroup.children[0].position.z = -0.4 + Math.sin(handAnimTime) * 0.1;
                    legsGroup.children[1].position.z = -0.4 - Math.sin(handAnimTime) * 0.1;
                } else {
                    handsGroup.position.y = THREE.MathUtils.lerp(handsGroup.position.y, 0, 0.1);
                    handsGroup.position.x = THREE.MathUtils.lerp(handsGroup.position.x, 0, 0.1);
                    legsGroup.position.y = THREE.MathUtils.lerp(legsGroup.position.y, 0, 0.1);
                }
            }

            prevTime = time;
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
