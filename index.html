<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Поляна от первого лица</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: sans-serif;
        }
        #instructions {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-image: url('starti .PNG');
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            padding-bottom: 50px;
            z-index: 10;
        }
        #start-btn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 220px;
            height: 120px;
            background: transparent;
            border: none;
            cursor: pointer;
            transition: transform 0.1s;
        }
        #start-btn:hover {
            transform: translate(-50%, -50%) scale(1.05);
        }
        .controls-hint {
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.9);
            font-size: 20px;
            font-weight: bold;
            text-align: center;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px 20px;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <div id="instructions">
        <button id="start-btn"></button>
        <div class="controls-hint">Управление: W, A, S, D — ходить, Пробел — прыгать, Мышь — оглядываться.</div>
    </div>

    <!-- Подключаем Three.js и PointerLockControls для управления от 1-го лица -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>

    <script>
        let scene, camera, renderer, controls;
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
        let canJump = false;
        let prevTime = performance.now();
        let velocity = new THREE.Vector3();
        let direction = new THREE.Vector3();
        let handsGroup, legsGroup;
        let handAnimTime = 0;
        let clock = new THREE.Clock();

        init();
        animate();

        function init() {
            // Сцена
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87ceeb);
            scene.fog = new THREE.FogExp2(0x87ceeb, 0.012);

            // Камера (от первого лица)
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.y = 1.7; // Рост человека

            // Рендерер
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.body.appendChild(renderer.domElement);

            // Управление мышкой (как в играх)
            controls = new THREE.PointerLockControls(camera, document.body);
            
            const instructions = document.getElementById('instructions');
            const startBtn = document.getElementById('start-btn');

            startBtn.addEventListener('click', () => {
                controls.lock();
            });

            controls.addEventListener('lock', () => {
                instructions.style.display = 'none';
            });

            controls.addEventListener('unlock', () => {
                instructions.style.display = 'flex';
            });

            scene.add(controls.object);

            // Обработка клавиатуры (включая прыжок на Пробел)
            const onKeyDown = function (event) {
                switch (event.code) {
                    case 'KeyW': case 'ArrowUp': moveForward = true; break;
                    case 'KeyS': case 'ArrowDown': moveBackward = true; break;
                    case 'KeyA': case 'ArrowLeft': moveLeft = true; break;
                    case 'KeyD': case 'ArrowRight': moveRight = true; break;
                    case 'Space':
                        if (canJump === true) {
                            velocity.y += 7.5; // Сила прыжка
                            canJump = false;
                        }
                        break;
                }
            };

            const onKeyUp = function (event) {
                switch (event.code) {
                    case 'KeyW': case 'ArrowUp': moveForward = false; break;
                    case 'KeyS': case 'ArrowDown': moveBackward = false; break;
                    case 'KeyA': case 'ArrowLeft': moveLeft = false; break;
                    case 'KeyD': case 'ArrowRight': moveRight = false; break;
                }
            };

            document.addEventListener('keydown', onKeyDown);
            document.addEventListener('keyup', onKeyUp);

            // Свет
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const sunLight = new THREE.DirectionalLight(0xfffaed, 0.9);
            sunLight.position.set(100, 300, 100);
            sunLight.castShadow = true;
            scene.add(sunLight);

            // Загрузчик текстур из репозитория
            const textureLoader = new THREE.TextureLoader();

            // 1. НЕБО (sky.JPG)
            const skyGeo = new THREE.SphereGeometry(500, 32, 32);
            const skyMat = new THREE.MeshBasicMaterial({
                map: textureLoader.load('sky.JPG'),
                side: THREE.BackSide
            });
            const sky = new THREE.Mesh(skyGeo, skyMat);
            scene.add(sky);

            // 2. ЗЕМЛЯ И ТРАВА (grass.WEBP)
            const floorGeo = new THREE.PlaneGeometry(300, 300);
            const grassTexture = textureLoader.load('grass.WEBP');
            grassTexture.wrapS = THREE.RepeatWrapping;
            grassTexture.wrapT = THREE.RepeatWrapping;
            grassTexture.repeat.set(150, 150);

            const floorMat = new THREE.MeshStandardMaterial({
                map: grassTexture,
                roughness: 0.8
            });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            scene.add(floor);

            // 3. РУКИ ЧЕЛОВЕКА (с правильным путем к ruka .WEBP)
            handsGroup = new THREE.Group();
            const handTexture = textureLoader.load('ruka%20.WEBP');
            const handMat = new THREE.MeshBasicMaterial({ map: handTexture, transparent: true });
            
            const handPlaneGeo = new THREE.PlaneGeometry(0.5, 0.5);
            
            const leftHandMesh = new THREE.Mesh(handPlaneGeo, handMat);
            leftHandMesh.position.set(-0.25, -0.3, -0.5);

            const rightHandMesh = new THREE.Mesh(handPlaneGeo, handMat);
            rightHandMesh.position.set(0.25, -0.3, -0.5);

            handsGroup.add(leftHandMesh, rightHandMesh);
            camera.add(handsGroup);

            // 4. НОГИ ЧЕЛОВЕКА (с правильным путем к noga .WEBP)
            legsGroup = new THREE.Group();
            const legTexture = textureLoader.load('noga%20.WEBP');
            const legMat = new THREE.MeshBasicMaterial({ map: legTexture, transparent: true });

            const legPlaneGeo = new THREE.PlaneGeometry(0.6, 0.6);

            const leftLegMesh = new THREE.Mesh(legPlaneGeo, legMat);
            leftLegMesh.position.set(-0.2, -0.9, -0.5);

            const rightLegMesh = new THREE.Mesh(legPlaneGeo, legMat);
            rightLegMesh.position.set(0.2, -0.9, -0.5);

            legsGroup.add(leftLegMesh, rightLegMesh);
            camera.add(legsGroup);

            // Изменение размера окна
            window.addEventListener('resize', onWindowResize);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            const time = performance.now();
            const delta = (time - prevTime) / 1000;

            if (controls.isLocked === true) {
                velocity.x -= velocity.x * 10.0 * delta;
                velocity.z -= velocity.z * 10.0 * delta;

                // Гравитация и прыжок
                velocity.y -= 9.8 * 6.0 * delta;
                controls.object.position.y += velocity.y * delta;

                if (controls.object.position.y < 1.7) {
                    velocity.y = 0;
                    controls.object.position.y = 1.7;
                    canJump = true;
                }

                direction.z = Number(moveForward) - Number(moveBackward);
                direction.x = Number(moveRight) - Number(moveLeft);
                direction.normalize();

                if (moveForward || moveBackward) velocity.z -= direction.z * 40.0 * delta;
                if (moveLeft || moveRight) velocity.x -= direction.x * 40.0 * delta;

                controls.moveRight(-velocity.x * delta);
                controls.moveForward(-velocity.z * delta);

                // Анимация покачивания рук и ног при ходьбе
                if (moveForward || moveBackward || moveLeft || moveRight) {
                    handAnimTime += delta * 12;
                    handsGroup.position.y = Math.sin(handAnimTime) * 0.03;
                    legsGroup.position.y = Math.sin(handAnimTime) * 0.05;
                } else {
                    handsGroup.position.y = THREE.MathUtils.lerp(handsGroup.position.y, 0, 0.1);
                    legsGroup.position.y = THREE.MathUtils.lerp(legsGroup.position.y, 0, 0.1);
                }
            }

            prevTime = time;
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
