<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Поляна от первого лица</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: sans-serif;
        }
        #instructions {
            position: absolute;
            top: 20px;
            width: 100%;
            text-align: center;
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            pointer-events: none;
            font-size: 18px;
            z-index: 10;
        }
    </style>
</head>
<body>
    <div id="instructions">Кликните мышкой по экрану, чтобы начать.<br>Управление: W, A, S, D — ходить, Мышь — оглядываться.</div>

    <!-- Подключаем Three.js и PointerLockControls для управления от 1-го лица -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>

    <script>
        let scene, camera, renderer, controls;
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
        let prevTime = performance.now();
        let velocity = new THREE.Vector3();
        let direction = new THREE.Vector3();
        let handsGroup, legsGroup;
        let handAnimTime = 0;
        let grassMesh;
        let clock = new THREE.Clock();

        init();
        animate();

        function init() {
            // Сцена
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87ceeb);
            scene.fog = new THREE.FogExp2(0x87ceeb, 0.012);

            // Камера (от первого лица)
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.y = 1.7; // Рост человека

            // Рендерер
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.body.appendChild(renderer.domElement);

            // Управление мышкой (как в играх)
            controls = new THREE.PointerLockControls(camera, document.body);
            
            const instructions = document.getElementById('instructions');
            document.body.addEventListener('click', () => {
                controls.lock();
            });

            controls.addEventListener('lock', () => {
                instructions.style.display = 'none';
            });

            controls.addEventListener('unlock', () => {
                instructions.style.display = 'block';
            });

            scene.add(controls.object);

            // Обработка клавиатуры
            const onKeyDown = function (event) {
                switch (event.code) {
                    case 'KeyW': case 'ArrowUp': moveForward = true; break;
                    case 'KeyS': case 'ArrowDown': moveBackward = true; break;
                    case 'KeyA': case 'ArrowLeft': moveLeft = true; break;
                    case 'KeyD': case 'ArrowRight': moveRight = true; break;
                }
            };

            const onKeyUp = function (event) {
                switch (event.code) {
                    case 'KeyW': case 'ArrowUp': moveForward = false; break;
                    case 'KeyS': case 'ArrowDown': moveBackward = false; break;
                    case 'KeyA': case 'ArrowLeft': moveLeft = false; break;
                    case 'KeyD': case 'ArrowRight': moveRight = false; break;
                }
            };

            document.addEventListener('keydown', onKeyDown);
            document.addEventListener('keyup', onKeyUp);

            // Свет
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const sunLight = new THREE.DirectionalLight(0xfffaed, 0.9);
            sunLight.position.set(100, 300, 100);
            sunLight.castShadow = true;
            scene.add(sunLight);

            // 1. НЕБО (Купол с вашей второй картинкой sky.jpg)
            const skyGeo = new THREE.SphereGeometry(500, 32, 32);
            const textureLoader = new THREE.TextureLoader();
            
            const skyMat = new THREE.MeshBasicMaterial({
                map: textureLoader.load('sky.jpg'),
                side: THREE.BackSide
            });
            const sky = new THREE.Mesh(skyGeo, skyMat);
            scene.add(sky);

            // 2. ЗЕМЛЯ И ОБЪЕМНАЯ ТРАВА (детализированные травинки вместо плоской картинки)
            const floorGeo = new THREE.PlaneGeometry(300, 300);
            const floorMat = new THREE.MeshStandardMaterial({
                color: 0x1b3b0f,
                roughness: 0.9
            });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            scene.add(floor);

            // Генерация детальных объемных травинок, реагирующих на ходьбу
            const bladesCount = 35000;
            const bladeGeometry = new THREE.ConeGeometry(0.035, 0.5, 3);
            bladeGeometry.translate(0, 0.25, 0);

            const instancedGrass = new THREE.InstancedMesh(
                bladeGeometry,
                new THREE.MeshStandardMaterial({ color: 0x38701d, roughness: 0.7 }),
                bladesCount
            );

            const dummy = new THREE.Object3D();
            for (let i = 0; i < bladesCount; i++) {
                const x = (Math.random() - 0.5) * 120;
                const z = (Math.random() - 0.5) * 120;
                dummy.position.set(x, 0, z);
                dummy.scale.set(1, 0.6 + Math.random() * 0.7, 1);
                dummy.rotation.y = Math.random() * Math.PI;
                dummy.updateMatrix();
                instancedGrass.setMatrixAt(i, dummy.matrix);
            }
            scene.add(instancedGrass);
            grassMesh = instancedGrass;

            // 3. РУКИ ЧЕЛОВЕКА (прикреплены к камере снизу)
            handsGroup = new THREE.Group();
            
            const skinMaterial = new THREE.MeshLambertMaterial({ color: 0xffdbac }); // Телесный цвет кожи
            const sleeveMaterial = new THREE.MeshLambertMaterial({ color: 0x224488 }); // Синий рукав кофты

            // Левая рука
            const leftArmGeo = new THREE.CylinderGeometry(0.06, 0.08, 0.6, 16);
            const leftArm = new THREE.Mesh(leftArmGeo, sleeveMaterial);
            leftArm.rotation.z = -Math.PI / 4;
            leftArm.position.set(-0.3, -0.35, -0.5);
            handsGroup.add(leftArm);

            // Правая рука
            const rightArmGeo = new THREE.CylinderGeometry(0.06, 0.08, 0.6, 16);
            const rightArm = new THREE.Mesh(rightArmGeo, sleeveMaterial);
            rightArm.rotation.z = Math.PI / 4;
            rightArm.position.set(0.3, -0.35, -0.5);
            handsGroup.add(rightArm);

            camera.add(handsGroup);

            // 4. НОГИ ЧЕЛОВЕКА (видимы снизу в поле зрения при ходьбе)
            legsGroup = new THREE.Group();
            const pantsMaterial = new THREE.MeshLambertMaterial({ color: 0x2c3e50 }); // Штаны
            
            const leftLeg = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.09, 0.7, 16), pantsMaterial);
            leftLeg.position.set(-0.15, -1.1, -0.4);
            leftLeg.rotation.x = 0.1;
            
            const rightLeg = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.09, 0.7, 16), pantsMaterial);
            rightLeg.position.set(0.15, -1.1, -0.4);
            rightLeg.rotation.x = -0.1;

            legsGroup.add(leftLeg, rightLeg);
            camera.add(legsGroup);

            // Изменение размера окна
            window.addEventListener('resize', onWindowResize);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            const time = performance.now();
            const delta = (time - prevTime) / 1000;
            const elapsedTime = clock.getElapsedTime();

            if (controls.isLocked === true) {
                velocity.x -= velocity.x * 10.0 * delta;
                velocity.z -= velocity.z * 10.0 * delta;

                direction.z = Number(moveForward) - Number(moveBackward);
                direction.x = Number(moveRight) - Number(moveLeft);
                direction.normalize();

                if (moveForward || moveBackward) velocity.z -= direction.z * 40.0 * delta;
                if (moveLeft || moveRight) velocity.x -= direction.x * 40.0 * delta;

                controls.moveRight(-velocity.x * delta);
                controls.moveForward(-velocity.z * delta);

                // Анимация покачивания рук и ног при ходьбе (трава под ногами реагирует)
                if (moveForward || moveBackward || moveLeft || moveRight) {
                    handAnimTime += delta * 12;
                    handsGroup.position.y = Math.sin(handAnimTime) * 0.03;
                    handsGroup.position.x = Math.cos(handAnimTime * 0.5) * 0.02;

                    // Шагающие движения ног
                    legsGroup.position.y = Math.sin(handAnimTime) * 0.05;
                    legsGroup.children[0].rotation.x = Math.sin(handAnimTime) * 0.3;
                    legsGroup.children[1].rotation.x = -Math.sin(handAnimTime) * 0.3;
                } else {
                    handsGroup.position.y = THREE.MathUtils.lerp(handsGroup.position.y, 0, 0.1);
                    handsGroup.position.x = THREE.MathUtils.lerp(handsGroup.position.x, 0, 0.1);
                    legsGroup.position.y = THREE.MathUtils.lerp(legsGroup.position.y, 0, 0.1);
                    legsGroup.children[0].rotation.x = THREE.MathUtils.lerp(legsGroup.children[0].rotation.x, 0.1, 0.1);
                    legsGroup.children[1].rotation.x = THREE.MathUtils.lerp(legsGroup.children[1].rotation.x, -0.1, 0.1);
                }
            }

            prevTime = time;
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
